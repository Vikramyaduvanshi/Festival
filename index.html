<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy New Year 🎉</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  height:100vh;
  background: radial-gradient(circle at top, #1b1f3b, #090a1a);
  color:white;
  overflow:hidden;
}

.container{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
}

h1{
  font-size:3.2rem;
  font-weight:700;
  text-shadow:0 0 20px #ffda79;
  animation: glow 2s infinite alternate;
}

.year{
  font-size:5rem;
  font-weight:700;
  margin:10px 0;
  background:linear-gradient(45deg,#ffdd00,#ff4ecd,#00eaff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.typing{
  font-size:1.2rem;
  margin-top:10px;
  min-height:30px;
  color:#ddd;
}

.card{
  margin-top:30px;
  background:rgba(255,255,255,0.1);
  padding:25px;
  border-radius:16px;
  backdrop-filter:blur(10px);
  box-shadow:0 0 30px rgba(255,255,255,0.15);
  max-width:420px;
}

.card p{
  font-size:1rem;
  line-height:1.6;
}

button{
  margin-top:25px;
  padding:12px 30px;
  font-size:1rem;
  border:none;
  border-radius:30px;
  background:linear-gradient(45deg,#ff512f,#f09819);
  color:white;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:scale(1.1);
  box-shadow:0 0 20px #f09819;
}

@keyframes glow{
  from{ text-shadow:0 0 10px #fff; }
  to{ text-shadow:0 0 25px #ffdd00; }
}

/* Fireworks */
.firework{
  position:absolute;
  width:6px;
  height:6px;
  background:white;
  border-radius:50%;
  animation: explode 1.5s ease-out forwards;
}

@keyframes explode{
  from{
    transform:translate(0,0) scale(1);
    opacity:1;
  }
  to{
    transform:translate(var(--x),var(--y)) scale(0);
    opacity:0;
  }
}

/* Mobile */
@media(max-width:600px){
  h1{font-size:2.4rem;}
  .year{font-size:3.5rem;}
}
</style>
</head>

<body>

<div class="container">
  <h1>🎉 Happy New Year 🎉</h1>
  <div class="year">2026</div>

  <div class="typing" id="typing"></div>

  <div class="card">
    <p>
      May this New Year bring you happiness, success, good health and endless opportunities.
      <br><br>
      🌟 Keep smiling, keep growing & keep shining 🌟
    </p>

    <button onclick="celebrate()">Celebrate 🎆</button>
  </div>
</div>

<script>
/* Typing Effect */
const messages = [
  "Wishing you joy & success ✨",
  "New dreams, new goals 🎯",
  "New memories to create 💖",
  "Cheers to a fresh start 🥂"
];

let i=0,j=0,isDeleting=false;
const typingDiv=document.getElementById("typing");

function typeEffect(){
  let current = messages[i];
  if(!isDeleting){
    typingDiv.innerHTML = current.substring(0,j++);
    if(j>current.length){
      isDeleting=true;
      setTimeout(()=>{},1000);
    }
  }else{
    typingDiv.innerHTML = current.substring(0,j--);
    if(j<0){
      isDeleting=false;
      i=(i+1)%messages.length;
    }
  }
  setTimeout(typeEffect,120);
}
typeEffect();

/* Fireworks */
function celebrate(){
  for(let i=0;i<80;i++){
    const firework=document.createElement("div");
    firework.className="firework";
    firework.style.left=Math.random()*window.innerWidth+"px";
    firework.style.top=Math.random()*window.innerHeight+"px";
    firework.style.background=`hsl(${Math.random()*360},100%,70%)`;
    firework.style.setProperty("--x",(Math.random()*400-200)+"px");
    firework.style.setProperty("--y",(Math.random()*400-200)+"px");
    document.body.appendChild(firework);
    setTimeout(()=>firework.remove(),1500);
  }
}
</script>

</body>
</html>
